name: Build Hermes

# Mirrors facebook/hermes .github/workflows/rn-build-hermes.yml (Apple part), with ./patches applied
# on top, and publishes the result as a GitHub Release. pages.yml serves it in Maven's layout.

on:
  workflow_dispatch:
    inputs:
      hermes-tag:
        description: Hermes tag from react-native/sdks/.hermesv1version (e.g. hermes-v250829098.0.17)
        required: true
        type: string
      revision:
        description: Build revision; bump it to republish the same Hermes version with different patches
        required: true
        default: '1'
        type: string
      publish:
        description: Create the GitHub Release (off = dry run, artifacts only)
        required: true
        default: true
        type: boolean

concurrency:
  group: build-${{ inputs.hermes-tag }}-${{ inputs.revision }}
  cancel-in-progress: false

env:
  XCODE_VERSION: '16.4'

jobs:
  hermesc:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-hermes
        with:
          hermes-tag: ${{ inputs.hermes-tag }}
      - name: Build host hermesc
        working-directory: hermes
        run: |
          source ./utils/build-apple-framework-rn.sh
          build_host_hermesc_if_needed || true
          if [[ ! -x build_host_hermesc/bin/hermesc ]]; then
            tail -150 build_host_hermesc/CMakeFiles/CMakeConfigureLog.yaml || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hermesc-apple
          path: hermes/build_host_hermesc

  slices:
    needs: hermesc
    runs-on: macos-15
    env:
      IOS_DEPLOYMENT_TARGET: '15.1'
      XROS_DEPLOYMENT_TARGET: '1.0'
      MAC_DEPLOYMENT_TARGET: '10.15'
    strategy:
      fail-fast: false
      matrix:
        flavor: [Debug, Release]
        slice: [macosx, iphoneos, iphonesimulator, appletvos, appletvsimulator, catalyst, xros, xrsimulator]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-hermes
        with:
          hermes-tag: ${{ inputs.hermes-tag }}
      - uses: actions/download-artifact@v4
        with:
          name: hermesc-apple
          path: hermes/build_host_hermesc
      - name: Build ${{ matrix.slice }} (${{ matrix.flavor }})
        working-directory: hermes
        env:
          SLICE: ${{ matrix.slice }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          chmod +x ./build_host_hermesc/bin/hermesc
          if [[ "$SLICE" == "macosx" ]]; then
            BUILD_TYPE="$FLAVOR" ./utils/build-mac-framework-rn.sh
          else
            BUILD_TYPE="$FLAVOR" ./utils/build-ios-framework-rn.sh "$SLICE"
          fi
          test -d "build_$SLICE/lib/hermesvm.framework"
          test -d "build_$SLICE/lib/hermesvm.framework.dSYM"
          mv "build_$SLICE" "build_${SLICE}_${FLAVOR}"
          tar -czf "build_${SLICE}_${FLAVOR}.tar.gz" "build_${SLICE}_${FLAVOR}"
      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.slice }}-${{ matrix.flavor }}
          path: hermes/build_${{ matrix.slice }}_${{ matrix.flavor }}.tar.gz

  package:
    needs: slices
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-hermes
        with:
          hermes-tag: ${{ inputs.hermes-tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: slice-*-${{ matrix.flavor }}
          path: hermes
          merge-multiple: true
      - name: Unpack slices
        working-directory: hermes
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          for archive in build_*_"$FLAVOR".tar.gz; do
            tar -xzf "$archive"
            dir="${archive%.tar.gz}"
            mv "$dir" "${dir%_"$FLAVOR"}"
          done
      - name: Verify CMake configuration
        run: scripts/verify-cmake.sh hermes expected-cmake.txt
      - name: Create universal framework
        working-directory: hermes
        run: |
          source ./utils/build-apple-framework-rn.sh
          prepare_dest_root_for_ci
          ./utils/build-ios-framework-rn.sh build_framework
          chmod +x ./destroot/bin/hermesc
      - name: Package
        working-directory: hermes
        env:
          FLAVOR: ${{ matrix.flavor }}
          HERMES_TAG: ${{ inputs.hermes-tag }}
        run: |
          set -euo pipefail
          (cd utils/scripts/hermes && yarn install --non-interactive --frozen-lockfile)
          version="${HERMES_TAG#hermes-v}"
          flavor="$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')"
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          tarball=$(node ./utils/scripts/hermes/create-tarball.js --inputDir . --buildType "$FLAVOR" --outputDir "$(mktemp -d)")
          mv "$tarball" "$out/hermes-ios-$version-$flavor.tar.gz"

          dsym_dir="$(mktemp -d)"
          for build in build_*; do
            platform="${build#build_}"
            [[ -d "$build/lib/hermesvm.framework.dSYM" ]] || continue
            mkdir -p "$dsym_dir/$platform"
            cp -R "$build/lib/hermesvm.framework.dSYM" "$dsym_dir/$platform/"
          done
          tar -C "$dsym_dir" -czf "$out/hermes-ios-$version-$flavor-dSYM.tar.gz" .

          cd "$out"
          for file in *.tar.gz; do
            shasum -a 256 "$file" | cut -d' ' -f1 > "$file.sha256"
          done
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.flavor }}
          path: dist

  release:
    needs: package
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_TAG: ${{ inputs.hermes-tag }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          tag="$HERMES_TAG-custom.$REVISION"
          {
            echo "Hermes \`$HERMES_TAG\` built with these patches:"
            echo
            for patch in patches/*.patch; do echo "- \`$(basename "$patch")\`"; done
            echo
            echo "Expected CMake settings:"
            echo
            sed 's/^/- `/; s/$/`/' expected-cmake.txt
          } > notes.md
          gh release create "$tag" dist/* --title "$tag" --notes-file notes.md --target "$GITHUB_SHA"
